<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2630">
<title>播種配貨</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--ink:#1c2630;--steel:#3b5670;--soft:#dfe6ec;--paper:#f3f5f7;--card:#fff;--line:#c8d1d9;--tape:#f2c230;--tape-ink:#231c00;
  --ok:#2f7d4f;--ok-bg:#dff2e6;--warn:#b0421c;--warn-bg:#fbeee8;--pri:#c26a00;--pri-bg:#fff1d6;--mute:#5b6b79}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:5px solid transparent;
  border-image:repeating-linear-gradient(-45deg,var(--tape) 0 12px,var(--ink) 12px 24px) 5}
header h1{margin:0;font-size:17px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:1px solid #5f7488;color:#fff;border-radius:8px;padding:5px 10px;font-size:14px;cursor:pointer}
#ver{font-size:11px;opacity:.6}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-weight:700;font-size:17px;cursor:pointer;background:var(--tape);color:var(--tape-ink);text-align:center}
.btn.sec{background:var(--steel);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--warn);color:#fff}
.btn.small{display:inline-block;width:auto;padding:7px 12px;font-size:14px}
.muted{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:12px}
.item:active{background:var(--soft)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--mute)}
.item.done{opacity:.55}
.item.done .t::after{content:' ✓';color:var(--ok)}
.pill{display:inline-block;border-radius:10px;padding:0 8px;font-size:12px;font-weight:700;background:var(--soft);color:var(--steel)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.pri{background:var(--pri-bg);color:var(--pri)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-weight:700;font-size:15px;cursor:pointer;color:var(--steel)}
.seg.four button{flex:1 1 auto;padding:8px 4px;font-size:14px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.big{font-size:26px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.sticky{position:sticky;top:52px;z-index:10;background:var(--paper);padding:6px 0 8px}
/* 層架圖：一面 5 層 × 5 格，從上層左邊開始編號 */
.face{margin-bottom:12px}
.face h3{margin:0 0 4px;font-size:14px;color:var(--steel)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1/1;border-radius:8px;border:2px solid var(--line);background:#e9edf1;color:#9aa7b3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;user-select:none;cursor:default;min-height:52px}
.cell .no{position:absolute;top:2px;left:5px;font-size:11px}
.cell .q{font-size:24px;line-height:1}
.cell.need{background:var(--tape);border-color:#c99a00;color:var(--tape-ink);cursor:pointer;box-shadow:0 2px 0 #c99a00}
.cell.need .no{color:var(--tape-ink)}
.cell.put{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);cursor:pointer}
.cell.cancel{background:repeating-linear-gradient(-45deg,var(--warn-bg) 0 6px,#f6d5c8 6px 12px);border-color:var(--warn);color:var(--warn)}
.cell.pri{outline:3px solid var(--pri);outline-offset:-1px}
.cell .tag{font-size:10px;line-height:1}
.cell.empty{background:#f6f7f8;border-style:dashed}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lines li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;font-size:18px}
.lines li .q{font-size:24px;font-weight:900;min-width:52px;text-align:right}
.lines li .n{flex:1;overflow-wrap:anywhere}
.lines li .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900}
.lines li.put{background:var(--ok-bg);border-color:var(--ok)}
.lines li.put .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:10px;font-weight:700}
.banner.cancel{background:var(--warn);color:#fff;font-size:20px}
.banner.pri{background:var(--pri-bg);color:var(--pri);border:2px solid var(--pri)}
.banner.info{background:var(--soft);color:var(--steel)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.navrow{display:flex;gap:8px;margin-top:12px}
.navrow .btn{flex:1}
input.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:17px;background:#fff}
.modal{position:fixed;inset:0;background:rgba(20,28,36,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--paper);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;z-index:60;font-size:15px;max-width:90vw;text-align:center}
#net{position:fixed;top:0;left:0;right:0;z-index:80;background:#b45309;color:#fff;text-align:center;font-size:13px;padding:3px}
.cell.issue{background:var(--warn);border-color:var(--warn);color:#fff;cursor:pointer}
.cell.issue .no{color:#fff}
.cell.todo{background:#fff;border-color:var(--line);color:var(--mute);cursor:pointer}
.cell.cancel[data-slot]{cursor:pointer}
.who{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;margin-top:6px;font-size:16px}
.who .nm{font-size:30px;font-weight:900;line-height:1.2}
.banner.note{background:#fff8d6;border:2px solid var(--tape);color:var(--tape-ink);margin:8px 0 0}
.lines li.chk{background:#e3ebf3;border-color:var(--steel)}
.lines li.chk .ck{background:var(--steel);border-color:var(--steel)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:15px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button:disabled{opacity:.4}
</style>
</head>
<body>
<div id="net" hidden>離線中：操作會先存在手機，連線後自動同步</div>
<header>
  <button id="backBtn" hidden aria-label="返回">‹ 返回</button>
  <h1 id="title">播種配貨</h1>
  <span id="ver"></span>
  <button id="flagBtn" hidden>異動</button>
</header>
<main id="app"></main>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* 播種配貨（手機）
   資料：Firestore ezfun-warehouse-billing
     seeding_tasks/{taskId}            任務：name、project、wh（倉庫中文名，例如 汐止倉）、ships[]（這個任務含的物流）、createdBy、assignees[]、members[]（指派＋開過網址的人）、status、rounds、orders
                                       舊任務的 ship 是 order-batcher「物流上傳」的設定，不一定是訂單實際的物流，不再顯示
     seeding_tasks/{taskId}/rounds/{r} 每輪（最多 50 籃、只含一種物流）：ship、orders[{slot,seq,id,name,p3,note,items[{k,name,sku,qty}]}]
        picked{ 商品雜湊: {by,byName,at,item} }    撿貨：這一輪要的數量已經撿齊
        placed{ "籃號_第幾項": {by,byName,at} }   播種已放
        checked{ "籃號_第幾項": {by,byName,at} }  檢查已核對
        owners{ 商品雜湊: {email,name,at,item} }  誰負責這個商品（不擋人，只提醒）
        flags{ 籃號: {type:'cancel'|'priority',...} }、issues{ 籃號: {type:'short'|'extra'|'wrong',note,...} }
     seeding_tasks/{taskId}/log        取消／優先／問題等異動紀錄
   籃號：A 面 1～25、B 面 26～50，每面 5 層 × 5 格，從最上層左邊開始往右、再往下。
   任務清單：同倉庫的人（hub_settings/users.warehouses 含任務的 wh）都看得到，點進去就加入；被指派只是標記。
   拿到任務網址（?task=）的 Hub 使用者也能加入（沒有 wh 的舊任務靠這個）。
   ?demo=1 用假資料，不連 Firestore（測試畫面用）。 */
const SEED_VERSION = '2026-11-26-2';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEMO = new URLSearchParams(location.search).has('demo');
const PER_FACE = 25, COLS = 5, RECENT = 30 * 60 * 1000;
$('#ver').textContent = 'v' + SEED_VERSION + (DEMO ? ' 測試' : '');

function toast(msg, ms = 2200){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, ms); }
function buzz(ms = 30){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
const fmtTime = ms => { const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
// 商品名稱可能含「.」等字元，不能直接當 Firestore 欄位名稱：轉成雜湊
const hk = s => { let h = 5381; for(const ch of String(s)) h = ((h * 33) ^ ch.codePointAt(0)) >>> 0; return 'p' + h.toString(36); };

/* ================= 資料層：Firestore 或測試假資料 ================= */
let me = null;   // {email, name}
const api = DEMO ? demoApi() : fireApi();

function fireApi(){
  firebase.initializeApp({
    apiKey: "AIzaSyBmb_51Pq-QatHwKkcrNlKw0B6e8YmKAsw",
    authDomain: "ezfun-warehouse-billing.firebaseapp.com",
    projectId: "ezfun-warehouse-billing",
    storageBucket: "ezfun-warehouse-billing.firebasestorage.app",
    messagingSenderId: "175590672953",
    appId: "1:175590672953:web:6304ddce7b45b191529be8"
  });
  const auth = firebase.auth(), db = firebase.firestore(), FV = firebase.firestore.FieldValue;
  db.enablePersistence({synchronizeTabs:true}).catch(() => {});
  const T = id => db.collection('seeding_tasks').doc(id);
  return {
    onAuth(cb){ auth.onAuthStateChanged(cb); auth.getRedirectResult().catch(e => cb(null, e)); },
    async login(){
      const p = new firebase.auth.GoogleAuthProvider();
      try{ await auth.signInWithPopup(p); }
      catch(e){
        const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if(e.code === 'auth/popup-blocked') throw new Error('彈出視窗被擋住了：iPhone 請到「設定 → Safari」關閉「阻擋彈出式視窗」，再按一次登入');
        if(e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
        if(!ios && e.code === 'auth/operation-not-supported-in-this-environment') return auth.signInWithRedirect(p);
        throw new Error('登入失敗：' + (e.code || e.message));
      }
    },
    logout(){ return auth.signOut(); },
    async profile(user){
      const [u, g] = await Promise.all([db.collection('hub_settings').doc('users').get(), db.collection('hub_settings').doc('global').get().catch(() => null)]);
      const users = u.exists ? u.data() : {}, email = (user.email || '').toLowerCase();
      const rec = users[email] || Object.entries(users).find(([k]) => k.toLowerCase() === email)?.[1];
      const admins = ((g && g.exists && g.data().superAdmins) || []).map(x => String(x).toLowerCase());
      return {ok: !!rec || admins.includes(email), admin: admins.includes(email), blocked: !!(rec && (rec.blockedSystems || []).includes('seeding')), name: (rec && rec.name) || user.displayName || email,
        warehouses: ((rec && rec.warehouses) || []).map(String).filter(Boolean)};
    },
    watchTasks(cb){
      // 每個查詢各自保留結果，再合併（同一個任務可能同時符合多個條件）
      const q = [db.collection('seeding_tasks').where('members', 'array-contains', me.email),
                 db.collection('seeding_tasks').where('assignees', 'array-contains', me.email),
                 db.collection('seeding_tasks').where('createdBy', '==', me.email)];
      // 同倉庫的任務：Firestore 的 in 一次最多 30 個值
      if(me.warehouses.length) q.push(db.collection('seeding_tasks').where('wh', 'in', me.warehouses.slice(0, 30)));
      const parts = q.map(() => new Map()), push = () => { const all = new Map(); parts.forEach(m => m.forEach((v, k) => all.set(k, v))); cb([...all.values()]); };
      const err = e => toast('讀取任務失敗：' + e.message, 5000);
      const us = q.map((qq, i) => qq.onSnapshot(qs => { parts[i] = new Map(qs.docs.map(d => [d.id, {id:d.id, ...d.data()}])); push(); }, err));
      return () => us.forEach(u => u());
    },
    watchTask(id, cb){
      let task = null, rounds = [], gotT = false;
      const push = () => gotT && cb(task, rounds);
      const u1 = T(id).onSnapshot(d => { gotT = true; task = d.exists ? {id:d.id, ...d.data()} : null; push(); }, e => toast('讀取失敗：' + e.message, 5000));
      const u2 = T(id).collection('rounds').onSnapshot(qs => { rounds = qs.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => a.no - b.no); push(); }, e => toast('讀取失敗：' + e.message, 5000));
      return () => { u1(); u2(); };
    },
    join(taskId){ return T(taskId).update({members: FV.arrayUnion(me.email), [`memberNames.${hk(me.email)}`]: me.name}); },
    // patch 的 key 可以是 "placed.12_0" 這種路徑；值為 null 代表刪除
    updateRound(taskId, rid, patch){
      const p = {}; for(const [k, v] of Object.entries(patch)) p[k] = v === null ? FV.delete() : v;
      return T(taskId).collection('rounds').doc(rid).update(p);
    },
    updateTask(taskId, patch){ return T(taskId).update(patch); },
    addLog(taskId, x){ return T(taskId).collection('log').add({...x, at: Date.now(), by: me.email, byName: me.name}); },
    // Firestore 刪文件不會連子集合一起刪：先刪 rounds、log 底下每一筆，最後刪任務本身
    async deleteTask(taskId){
      for(const sub of ['rounds', 'log']){
        const qs = await T(taskId).collection(sub).get();
        for(let i = 0; i < qs.docs.length; i += 400){ const b = db.batch(); qs.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
      }
      await T(taskId).delete();
    },
  };
}

function demoApi(){
  const names = ['海報 A','T恤 黑 M','T恤 白 L','T恤 黑 XL','mollis純棉日拋褲六入組 XL','毛巾','貼紙組','帽子','T恤 白 S','鑰匙圈','水壺袋','徽章'];
  let seed = 7; const R = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const mkRound = (no, n, seq0, ship) => ({id: String(no).padStart(3,'0'), no, ship, seqFrom:seq0, seqTo:seq0+n-1, picked:{}, placed:{}, flags:{}, checked:{}, owners:{}, issues:{},
    orders: Array.from({length:n}, (_, i) => { const k = 1 + Math.floor(R()*3), s = new Set(); while(s.size < k) s.add(names[Math.floor(R()*names.length)]);
      return {slot:i+1, seq:seq0+i, id:'2026112500' + String(seq0+i).padStart(4,'0'), name:'測試' + (seq0+i), p3:String(100 + Math.floor(R()*900)), note: i % 7 === 3 ? '不要放發票' : '',
        items:[...s].map((nm, k2) => ({k:k2, name:nm, sku:'SKU-' + names.indexOf(nm), qty: R() < .8 ? 1 : 2}))}; })});
  const task = {id:'demo', name:'測試任務 1125', project:'測試專案', wh:'汐止倉', ships:['7-11','全家'], createdBy:'me@test', assignees:['me@test'], members:['me@test'], assigneeNames:{'me@test':'測試員'}, status:'open', createdAt:Date.now(), rounds:2, orders:73};
  const rounds = [mkRound(1, 50, 31, '7-11'), mkRound(2, 23, 81, '全家')];
  const subs = new Set(); const emit = () => subs.forEach(f => f());
  const setPath = (obj, path, v) => { const ks = path.split('.'); let o = obj; ks.slice(0,-1).forEach(k => o = o[k] = o[k] || {}); if(v === null) delete o[ks.at(-1)]; else o[ks.at(-1)] = v; };
  window.__demo = {task, rounds, emit};
  return {
    onAuth(cb){ setTimeout(() => cb({email:'me@test', displayName:'測試員'}), 0); },
    login(){}, logout(){ location.reload(); },
    async profile(){ return {ok:true, blocked:false, name:'測試員', warehouses:['汐止倉']}; },
    watchTasks(cb){ const f = () => cb(task.deleted ? [] : [task]); subs.add(f); f(); return () => subs.delete(f); },
    watchTask(id, cb){ const f = () => cb({...task}, rounds.map(r => JSON.parse(JSON.stringify(r)))); subs.add(f); f(); return () => subs.delete(f); },
    async join(){},
    async updateRound(tid, rid, patch){ const r = rounds.find(x => x.id === rid); for(const [k, v] of Object.entries(patch)) setPath(r, k, v); emit(); },
    async updateTask(tid, patch){ Object.assign(task, patch); emit(); },
    async addLog(){},
    async deleteTask(){ task.deleted = true; emit(); },
  };
}

/* ================= 狀態與工具 ================= */
const S = {view:'login', taskId:null, task:null, rounds:[], rid:null, mode:'pick', itemKey:null, slot:null, showClosed:false, unsub:null, unsubTasks:null, tasks:[], warned:{}};
const round = () => S.rounds.find(r => r.id === S.rid);
const faceOf = slot => slot <= PER_FACE ? 'A' : 'B';
const pkey = (slot, k) => `${slot}_${k}`;
const itemKeyOf = it => it.sku || it.name;
const flagOf = (r, slot) => (r.flags || {})[slot] || null;
const isCancel = (r, slot) => (flagOf(r, slot) || {}).type === 'cancel';
const isPri = (r, slot) => (flagOf(r, slot) || {}).type === 'priority';
const issueOf = (r, slot) => (r.issues || {})[slot] || null;
const ISSUE = {short:'缺件', extra:'多件', wrong:'放錯商品', other:'其他'};
const stamp = () => ({by: me.email, byName: me.name, at: Date.now()});
const posText = slot => { const i = (slot - 1) % PER_FACE; return `${faceOf(slot)} 面第 ${Math.floor(i / COLS) + 1} 層第 ${i % COLS + 1} 格`; };

// 播種進度：取消的訂單不算
function roundStat(r){
  let total = 0, put = 0;
  (r.orders || []).forEach(o => { if(isCancel(r, o.slot)) return; o.items.forEach(it => { total++; if((r.placed || {})[pkey(o.slot, it.k)]) put++; }); });
  return {total, put, done: total > 0 && put === total};
}
// 檢查進度（以籃為單位）
function basketCheck(r, o){
  const n = o.items.length, c = o.items.filter(it => (r.checked || {})[pkey(o.slot, it.k)]).length;
  return {n, c, done: n > 0 && c === n, issue: issueOf(r, o.slot), cancel: isCancel(r, o.slot)};
}
function checkStat(r){
  let total = 0, done = 0, issues = 0;
  (r.orders || []).forEach(o => { const b = basketCheck(r, o); if(b.cancel) return; total++; if(b.issue) issues++; else if(b.done) done++; });
  return {total, done, issues};
}
// 最近 30 分鐘有動作的人
function activePeople(r){
  const t = Date.now() - RECENT, m = new Map();
  [r.placed, r.checked].forEach(o => Object.values(o || {}).forEach(v => { if(v && v.at > t) m.set(v.by, v.byName || v.by); }));
  return [...m.values()];
}
// 以商品為主：同一個商品在這一輪要放進哪些籃
function productsOf(r){
  const m = new Map();
  (r.orders || []).forEach(o => o.items.forEach(it => {
    const key = itemKeyOf(it); if(!m.has(key)) m.set(key, {key, name:it.name, sku:it.sku, need:[], total:0, put:0, units:0});
    const p = m.get(key); p.need.push({slot:o.slot, k:it.k, qty:it.qty});
    if(!isCancel(r, o.slot)){ p.total++; p.units += Number(it.qty) || 0; if((r.placed || {})[pkey(o.slot, it.k)]) p.put++; }
  }));
  // 同種類商品排在一起：依品名排序，尺寸照 S→M→L→XL 而不是字母順序；放完的排到最後
  return [...m.values()].sort((a,b) => (a.put === a.total) - (b.put === b.total) || byName(a, b));
}
const coll = new Intl.Collator('zh-Hant', {numeric: true, sensitivity: 'base'});
const SIZE_RANK = Object.fromEntries(['XXS','XS','S','M','L','XL','XXL','2XL','XXXL','3XL','4XL','5XL','FREE','F'].map((s, i) => [s, i + 1]));
const SIZE_RE = /^(.*)\b(XXS|XS|S|M|L|XL|XXL|2XL|XXXL|3XL|4XL|5XL|FREE|F)\b(.*)$/i;
function nameParts(name){
  const s = String(name || ''), m = s.match(SIZE_RE);
  return m ? {base: m[1].trim(), rest: m[3].trim(), size: SIZE_RANK[m[2].toUpperCase()]} : {base: s, rest: '', size: 0};
}
function byName(a, b){
  const x = nameParts(a.name), y = nameParts(b.name);
  return coll.compare(x.base, y.base) || coll.compare(x.rest, y.rest) || x.size - y.size || coll.compare(a.name, b.name) || coll.compare(a.key, b.key);
}
// 撿貨清單：依品名排序（勾了不移動位置）；整項都取消的商品不用撿
const pickList = r => productsOf(r).filter(p => p.total > 0).sort(byName);
const pickedOf = (r, key) => (r.picked || {})[hk(key)] || null;
function pickStat(r){ const ps = pickList(r), n = ps.filter(p => pickedOf(r, p.key)).length; return {n, total: ps.length, done: ps.length > 0 && n === ps.length}; }
const ownerOf = (r, key) => (r.owners || {})[hk(key)] || null;
// 物流：新任務每輪各自記錄；舊任務的 ship 是上傳設定，可能跟實際不同，不顯示
const shipOf = r => (r && r.ship) || '';
const taskShips = (t, rs) => (t.ships && t.ships.length ? t.ships : [...new Set(rs.map(shipOf).filter(Boolean))]);

/* ================= 畫面 ================= */
function setHeader(title, back){
  $('#title').textContent = title; $('#backBtn').hidden = !back; $('#flagBtn').hidden = !S.taskId || S.view === 'login' || S.view === 'tasks';
}
$('#backBtn').onclick = () => {
  if(S.view === 'item' || S.view === 'slot' || S.view === 'check'){ S.view = 'round'; S.itemKey = null; S.slot = null; }
  else if(S.view === 'round'){ S.view = 'task'; S.rid = null; }
  else if(S.view === 'task'){ openTasks(); return; }
  render(); window.scrollTo(0, 0);
};
$('#flagBtn').onclick = () => openFlagSheet();

function render(){
  const app = $('#app');
  if(S.view === 'login') return;
  if(S.view === 'tasks') return renderTasks(app);
  if(!S.task){ app.innerHTML = '<div class="card muted">讀取中…</div>'; return; }
  if(S.view === 'task') return renderTask(app);
  const r = round(); if(!r){ S.view = 'task'; return renderTask(app); }
  if(S.view === 'round') return renderRound(app, r);
  if(S.view === 'item') return renderItem(app, r);
  if(S.view === 'slot') return renderSlot(app, r);
  if(S.view === 'check') return renderCheck(app, r);
}

    ${/Line\/|FBAN|FBAV|Instagram/i.test(navigator.userAgent) ? '<p class="muted" style="color:var(--warn)">LINE 內建瀏覽器無法登入，請點右上角「…」用 Safari 或 Chrome 開啟。</p>' : ''}</div>`;

        <span class="pill ${t.status === 'closed' ? '' : 'ok'}">${t.status === 'closed' ? '已結束' : '進行中'}</span></div>`; }).join('')

function openTask(id){
  S.taskId = id; S.task = null; S.rounds = []; S.view = 'task';
  const u = new URL(location.href); u.searchParams.set('task', id); history.replaceState(null, '', u);
  if(S.unsub) S.unsub();
  let joined = false;
  S.unsub = api.watchTask(id, (t, rs) => {
    if(!t){ S.unsub && S.unsub(); S.unsub = null; toast('找不到這個任務（可能已被刪除或網址有誤）', 5000); openTasks(); return; }
    S.task = t; S.rounds = rs;
    // 點進來（從清單或網址）就自動加入成員，之後任務會出現在他的清單
    if(!joined && !(t.members || []).includes(me.email)){ joined = true; api.join(id).catch(() => {}); }
    render();
  });
  render();
}
function renderTask(app){
  const t = S.task; setHeader(t.name, true);
  let tot = 0, put = 0, flags = 0, ck = 0, ckt = 0, iss = 0;
  S.rounds.forEach(r => { const s = roundStat(r), c = checkStat(r); tot += s.total; put += s.put; flags += Object.keys(r.flags || {}).length; ck += c.done; ckt += c.total; iss += c.issues; });
  const ships = taskShips(t, S.rounds);
  app.innerHTML = `
    <div class="card"><div class="muted">${[t.project, t.wh, ships.join('、')].filter(Boolean).map(esc).join('・')}</div>
      <div>播種 <b>${put}</b>/${tot} 項・檢查 <b>${ck}</b>/${ckt} 籃・${S.rounds.length} 輪${flags ? `・<span class="pill warn">${flags} 筆異動</span>` : ''}${iss ? `・<span class="pill warn">${iss} 籃有問題</span>` : ''}</div>
      <div class="bar"><i style="width:${tot ? put / tot * 100 : 0}%"></i></div>
      <div class="bar"><i style="width:${ckt ? ck / ckt * 100 : 0}%;background:var(--steel)"></i></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost small" id="share">分享任務網址</button></div></div>
    <div class="list">${S.rounds.map(r => { const s = roundStat(r), c = checkStat(r), pk = pickStat(r), nf = Object.keys(r.flags || {}).length, ppl = activePeople(r);
      return `<div class="item ${c.total && c.done === c.total ? 'done' : ''}" data-r="${esc(r.id)}"><div class="main">
        <div class="t">第 ${r.no} 輪${shipOf(r) ? '・' + esc(shipOf(r)) : ''}${r.sheet && r.sheet !== shipOf(r) ? '・' + esc(r.sheet) : ''}　單序 ${r.seqFrom}–${r.seqTo}</div>
        <div class="s">${(r.orders || []).length} 籃・撿貨 ${pk.n}/${pk.total}・播種 ${s.put}/${s.total}・檢查 ${c.done}/${c.total}${nf ? `・<span class="pill warn">${nf} 異動</span>` : ''}${c.issues ? `・<span class="pill warn">${c.issues} 問題</span>` : ''}</div>
        ${ppl.length ? `<div class="s">👤 ${esc(ppl.join('、'))}</div>` : ''}
        <div class="bar"><i style="width:${s.total ? s.put / s.total * 100 : 0}%"></i></div></div></div>`; }).join('')}</div>
    ${t.createdBy === me.email || me.admin ? `<div class="card" style="margin-top:12px"><button class="btn ghost" id="closeTask">${t.status === 'closed' ? '重新開啟這個任務' : '結束這個任務'}</button>
      <p class="muted">結束後就不會出現在大家的清單（勾「顯示已結束」仍可查看）。</p>
      <button class="btn danger" id="delTask" style="margin-top:10px">刪除這個任務</button>
      <p class="muted">刪除後所有輪次、撿貨／播種／檢查紀錄和問題回報都會消失，無法復原；正在用的同事會被帶回任務清單。只有發布的人和 Hub 管理員看得到這兩個按鈕。</p></div>` : ''}`;
  app.querySelectorAll('[data-r]').forEach(el => el.onclick = () => openRound(el.dataset.r));
  $('#share').onclick = async () => {
    const url = location.origin + location.pathname + '?task=' + encodeURIComponent(t.id);
    try{ if(navigator.share){ await navigator.share({title: t.name, url}); return; } await navigator.clipboard.writeText(url); toast('已複製任務網址'); }
    catch(e){ prompt('複製這個網址傳給同事：', url); }
  };
  const ct = $('#closeTask'); if(ct) ct.onclick = async () => {
    const closing = t.status !== 'closed';
    if(closing && !confirm('確定結束這個任務？')) return;
    await api.updateTask(t.id, {status: closing ? 'closed' : 'open'}); toast(closing ? '已結束' : '已重新開啟');
  };
  const dt = $('#delTask'); if(dt) dt.onclick = async () => {
    const done = S.rounds.reduce((a, r) => a + Object.keys(r.placed || {}).length + Object.keys(r.checked || {}).length, 0);
    if(!confirm(`確定刪除「${t.name}」？\n\n${S.rounds.length} 輪、${t.orders || 0} 單${done ? `，已經有 ${done} 筆播種／檢查紀錄` : ''}。\n刪除後無法復原。`)) return;
    dt.disabled = true; dt.textContent = '刪除中…';
    const id = t.id;
    try{
      if(S.unsub){ S.unsub(); S.unsub = null; }   // 先停止監聽，免得刪到一半畫面跳「找不到任務」
      await api.deleteTask(id);
      toast('已刪除'); openTasks();
    }catch(e){ toast('刪除失敗：' + e.message, 5000); dt.disabled = false; dt.textContent = '刪除這個任務'; openTask(id); }
  };
}

function openRound(rid){
  if(!S.rounds.some(x => x.id === rid)) return;
  S.rid = rid; S.view = 'round'; render(); window.scrollTo(0, 0);
}
function roundHead(r){
  const s = roundStat(r), c = checkStat(r), pk = pickStat(r), ppl = activePeople(r);
  return `
    <div class="sticky">
      <div class="seg four">${[['pick','撿貨'],['item','播種・商品'],['slot','播種・籃子'],['check','檢查']].map(([m, t]) => `<button data-m="${m}" class="${S.mode === m ? 'on' : ''}">${t}</button>`).join('')}</div>
      <div class="muted">${shipOf(r) ? `<b>${esc(shipOf(r))}</b>・` : ''}單序 ${r.seqFrom}–${r.seqTo}・${S.mode === 'pick' ? `撿貨 ${pk.n}/${pk.total} 種` : `播種 ${s.put}/${s.total} 項`}・檢查 ${c.done}/${c.total} 籃${c.issues ? `・<b style="color:var(--warn)">${c.issues} 籃有問題</b>` : ''}${ppl.length ? `・👤 ${esc(ppl.join('、'))}` : ''}</div>
      <div class="bar"><i style="width:${S.mode === 'check' ? (c.total ? c.done / c.total * 100 : 0) : S.mode === 'pick' ? (pk.total ? pk.n / pk.total * 100 : 0) : (s.total ? s.put / s.total * 100 : 0)}%;${S.mode === 'check' ? 'background:var(--steel)' : ''}"></i></div>
    </div>`;
}
function renderRound(app, r){
  setHeader(`第 ${r.no} 輪`, true);
  const s = roundStat(r), c = checkStat(r);
  let body = '';
  if(S.mode === 'pick'){
    const ps = pickList(r), pk = pickStat(r);
    body = (pk.done ? '<div class="banner ok">這一輪的商品都撿齊了 👍 切到「播種・商品」開始配。</div>' : '')
      + `<p class="muted" style="margin:0 0 8px">先把這一輪要的商品撿齊：撿齊一種就點一下打勾，大家都看得到。數量不夠的話照撿，配完到「檢查」回報缺件。</p>`
      + `<ul class="lines">${ps.map((p, i) => { const pd = pickedOf(r, p.key);
        return `<li class="${pd ? 'put' : ''}" data-pi="${i}"><span class="ck">${pd ? '✓' : ''}</span><span class="n">${esc(p.name)}<br><span class="muted">${p.sku ? esc(p.sku) + '・' : ''}${p.total} 籃${pd ? `・${esc(pd.byName || pd.by)} ${fmtTime(pd.at)}` : ''}</span></span><span class="q">${p.units}</span></li>`; }).join('')}</ul>`;
    app.innerHTML = roundHead(r) + body;
    app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.mode = b.dataset.m; render(); });
    app.querySelectorAll('[data-pi]').forEach(el => el.onclick = () => {
      const p = ps[Number(el.dataset.pi)], on = !pickedOf(r, p.key);
      buzz(on ? 30 : [20, 40, 20]);
      api.updateRound(S.taskId, r.id, {[`picked.${hk(p.key)}`]: on ? {...stamp(), item: p.name} : null}).catch(e => toast('儲存失敗：' + e.message, 4000));
    });
    return;
  }
  if(S.mode === 'item'){
    body = (s.done ? '<div class="banner ok">這一輪播種全部放完了 👍 託運單照籃號順序放進籃子，再切到「檢查」核對。</div>' : '')
      + `<p class="muted" style="margin:0 0 8px">一人負責一種商品：點進商品按「我負責」，大家就看得到誰在放什麼。</p>`
      + `<div class="list">${productsOf(r).map(p => { const ow = ownerOf(r, p.key);
        return `<div class="item ${p.put === p.total ? 'done' : ''}" data-k="${esc(p.key)}"><div class="main"><div class="t">${esc(p.name)}</div>
        <div class="s">${p.sku ? esc(p.sku) + '・' : ''}${p.total} 籃・共 ${p.units} 件・已放 ${p.put}</div>
        ${ow ? `<div class="s"><span class="pill ${ow.email === me.email ? 'ok' : 'pri'}">👤 ${esc(ow.email === me.email ? '我負責' : ow.name)}</span></div>` : ''}</div>
        <span class="big" style="font-size:22px">${p.units}</span></div>`; }).join('')}</div>`;
  }else if(S.mode === 'slot'){
    body = gridHtml(r, slot => {
      const o = r.orders.find(x => x.slot === slot); if(!o) return {cls:'empty', q:''};
      const n = o.items.length, put = o.items.filter(it => (r.placed || {})[pkey(slot, it.k)]).length;
      if(isCancel(r, slot)) return {cls:'cancel', q:'取消'};
      return {cls: put === n ? 'put' : 'need', q: put === n ? '✓' : `${n - put}`, tag: put === n ? '' : '項', pri: isPri(r, slot), click:true};
    });
  }else{
    const iss = (r.orders || []).filter(o => issueOf(r, o.slot) && !isCancel(r, o.slot));
    body = (c.total && c.done === c.total ? '<div class="banner ok">這一輪全部檢查完了，可以包裝 👍</div>' : '')
      + `<button class="btn sec" id="findBtn" style="margin-bottom:10px">🔍 找籃子（不知道這籃是誰的）</button>`
      + (iss.length ? `<div class="card" style="border-color:var(--warn)"><b style="color:var(--warn)">有問題的籃子</b>${iss.map(o => { const x = issueOf(r, o.slot);
          return `<div class="item" data-cs="${o.slot}" style="margin-top:6px"><div class="main"><div class="t">${o.slot} 號籃・${esc(o.name)}</div><div class="s">${esc(ISSUE[x.type] || x.type)}${x.note ? '：' + esc(x.note) : ''}・${esc(x.byName || x.by)} ${fmtTime(x.at)}</div></div></div>`; }).join('')}</div>` : '')
      + `<p class="muted" style="margin:0 0 8px">灰色＝還沒檢查、黃色＝檢查到一半、綠色＝可包裝、紅色＝有問題。點籃子開始核對。</p>`
      + gridHtml(r, slot => {
        const o = r.orders.find(x => x.slot === slot); if(!o) return {cls:'empty', q:''};
        const b = basketCheck(r, o);
        if(b.cancel) return {cls:'cancel', q:'取消', click:true};
        if(b.issue) return {cls:'issue', q:'問題', click:true};
        if(b.done) return {cls:'put', q:'✓', tag:'可包裝', click:true};
        if(b.c) return {cls:'need', q:`${b.c}/${b.n}`, click:true};
        return {cls:'todo', q:'', tag:'待檢', pri: isPri(r, slot), click:true};
      });
  }
  app.innerHTML = roundHead(r) + body;
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.mode = b.dataset.m; render(); });
  app.querySelectorAll('[data-k]').forEach(el => el.onclick = () => openItem(r, el.dataset.k));
  app.querySelectorAll('.cell[data-slot]').forEach(el => el.onclick = () => { S.slot = Number(el.dataset.slot); S.view = S.mode === 'check' ? 'check' : 'slot'; render(); window.scrollTo(0, 0); });
  app.querySelectorAll('[data-cs]').forEach(el => el.onclick = () => { S.slot = Number(el.dataset.cs); S.view = 'check'; render(); window.scrollTo(0, 0); });
  const fb = $('#findBtn'); if(fb) fb.onclick = () => openFindSheet();
}
// 層架圖：A 面、B 面各 5×5
function gridHtml(r, cellOf){
  const used = Math.max(...(r.orders || []).map(o => o.slot), 0);
  const faces = used > PER_FACE ? ['A','B'] : ['A'];
  return faces.map(f => {
    const base = f === 'A' ? 0 : PER_FACE;
    let cells = '';
    for(let i = 1; i <= PER_FACE; i++){
      const slot = base + i, c = cellOf(slot);
      cells += `<div class="cell ${c.cls}${c.pri ? ' pri' : ''}" ${c.click ? `data-slot="${slot}"` : ''}><span class="no">${slot}</span><span class="q">${esc(c.q)}</span>${c.tag ? `<span class="tag">${esc(c.tag)}</span>` : ''}</div>`;
    }
    return `<div class="face"><h3>${f} 面（${base + 1}～${base + PER_FACE}，最上層左邊開始）</h3><div class="grid">${cells}</div></div>`;
  }).join('');
}

function openItem(r, key){
  const ow = ownerOf(r, key);
  if(ow && ow.email !== me.email && !S.warned[r.id + key]){ S.warned[r.id + key] = 1; toast(`${ow.name} 負責這個商品中，可以一起放`, 3000); }
  S.itemKey = key; S.view = 'item'; render(); window.scrollTo(0, 0);
}
function renderItem(app, r){
  const p = productsOf(r).find(x => x.key === S.itemKey);
  if(!p){ S.view = 'round'; return renderRound(app, r); }
  setHeader(`第 ${r.no} 輪・商品`, true);
  const needMap = new Map(p.need.map(n => [n.slot, n]));
  const left = p.total - p.put, ow = ownerOf(r, p.key), mine = ow && ow.email === me.email;
  app.innerHTML = `
    <div class="sticky"><div class="big">${esc(p.name)}</div>
      <div class="muted">${p.sku ? esc(p.sku) + '・' : ''}共 ${p.units} 件・${left ? `還有 <b>${left}</b> 籃要放` : '這個商品放完了'}</div>
      <div class="row" style="margin-top:6px"><span class="muted">${ow ? `👤 ${esc(mine ? '我負責' : ow.name + ' 負責中')}` : '還沒有人負責'}</span>
        <button class="btn ${mine ? 'ghost' : ''} small" id="own" style="flex:none">${mine ? '取消負責' : (ow ? '改成我負責' : '我負責')}</button></div></div>
    <p class="muted" style="margin:0 0 8px">黃色格子＝要放，格子上的數字是件數；放好點一下變綠色，點錯再點一下取消。</p>
    ${gridHtml(r, slot => {
      const n = needMap.get(slot); if(!n) return {cls:'', q:''};
      if(isCancel(r, slot)) return {cls:'cancel', q:'取消'};
      const put = !!(r.placed || {})[pkey(slot, n.k)];
      return {cls: put ? 'put' : 'need', q: put ? '✓' : `×${n.qty}`, pri: isPri(r, slot), click:true};
    })}
    <div class="navrow"><button class="btn ghost" id="toList">商品清單</button>${left ? '' : '<button class="btn" id="nextItem">下一個商品</button>'}</div>`;
  $('#own').onclick = () => {
    api.updateRound(S.taskId, r.id, {[`owners.${hk(p.key)}`]: mine ? null : {email: me.email, name: me.name, at: Date.now(), item: p.name}}).catch(e => toast('儲存失敗：' + e.message, 4000));
    buzz();
  };
  app.querySelectorAll('.cell[data-slot]').forEach(el => el.onclick = () => {
    const slot = Number(el.dataset.slot), n = needMap.get(slot); if(!n || isCancel(r, slot)) return;
    const k = pkey(slot, n.k), on = !(r.placed || {})[k];
    buzz(on ? 30 : [20, 40, 20]);
    api.updateRound(S.taskId, r.id, {[`placed.${k}`]: on ? stamp() : null}).catch(e => toast('儲存失敗：' + e.message, 4000));
    if(on && isPri(r, slot)) toast(`第 ${slot} 籃是優先處理`);
  });
  $('#toList').onclick = () => { S.view = 'round'; render(); };
  // 下一個商品：優先挑沒人負責、還沒放完的
  const nx = $('#nextItem'); if(nx) nx.onclick = () => {
    const rest = productsOf(r).filter(x => x.put < x.total), q = rest.find(x => !ownerOf(r, x.key)) || rest[0];
    if(q) openItem(r, q.key); else { S.view = 'round'; render(); }
  };
}

function slotHeader(r, o, big){
  const f = flagOf(r, o.slot);
  return `<div class="sticky"><div class="row" style="align-items:baseline"><div class="big" style="font-size:40px;flex:none">${o.slot} 號籃</div><div class="muted">${posText(o.slot)}</div></div>
      ${big ? `<div class="who"><div class="nm">${esc(o.name)}</div><div>訂單 <b>${esc(o.id)}</b></div><div>單序 <b>${o.seq}</b>・末三碼 <b>${esc(o.p3)}</b>${shipOf(r) ? '・' + esc(shipOf(r)) : ''}</div></div>`
        : `<div class="muted">單序 ${o.seq}・${esc(o.name)}（末三碼 ${esc(o.p3)}）・${esc(o.id)}</div>`}
      ${o.note ? `<div class="banner note">備註：${esc(o.note)}</div>` : ''}</div>
    ${isCancel(r, o.slot) ? `<div class="banner cancel">已取消，不要放，已放的退回上架</div>` : ''}
    ${f && f.type === 'priority' ? `<div class="banner pri">優先處理</div>` : ''}
    ${f ? `<p class="muted" style="margin-top:-4px">${esc(f.byName || f.by)} 標記於 ${fmtTime(f.at)}</p>` : ''}`;
}
function slotNav(r, o, filter, word = ''){
  const slots = r.orders.filter(filter || (() => true)).map(x => x.slot).sort((a,b) => a - b);
  const prev = slots.filter(s => s < o.slot).at(-1), next = slots.find(s => s > o.slot);
  return {html: `<div class="navrow"><button class="btn ghost" id="prev" ${prev ? '' : 'disabled'}>‹ ${prev ? `${word}${prev} 號` : ''}</button><button class="btn ghost" id="next" ${next ? '' : 'disabled'}>${next ? `${word}${next} 號` : (word ? '沒有待檢了' : '')} ›</button></div>`, prev, next};
}
function bindNav(nav){
  $('#prev').onclick = () => { if(nav.prev){ S.slot = nav.prev; render(); window.scrollTo(0, 0); } };
  $('#next').onclick = () => { if(nav.next){ S.slot = nav.next; render(); window.scrollTo(0, 0); } };
}
function renderSlot(app, r){
  const o = r.orders.find(x => x.slot === S.slot);
  if(!o){ S.view = 'round'; return renderRound(app, r); }
  setHeader(`第 ${r.no} 輪・播種`, true);
  const cancel = isCancel(r, o.slot), nav = slotNav(r, o);
  app.innerHTML = slotHeader(r, o, false) + `
    <ul class="lines">${o.items.map(it => { const put = !!(r.placed || {})[pkey(o.slot, it.k)];
      return `<li class="${put ? 'put' : ''}" data-k="${it.k}"><span class="ck">${put ? '✓' : ''}</span><span class="n">${esc(it.name)}${it.sku ? `<br><span class="muted">${esc(it.sku)}</span>` : ''}</span><span class="q">×${esc(it.qty)}</span></li>`; }).join('')}</ul>` + nav.html;
  app.querySelectorAll('.lines li').forEach(el => el.onclick = () => {
    if(cancel) return toast('這張單已取消');
    const k = pkey(o.slot, el.dataset.k), on = !(r.placed || {})[k];
    buzz(on ? 30 : [20, 40, 20]);
    api.updateRound(S.taskId, r.id, {[`placed.${k}`]: on ? stamp() : null}).catch(e => toast('儲存失敗：' + e.message, 4000));
  });
  bindNav(nav);
}

/* ================= 檢查：逐籃核對，跟播種分開記錄 ================= */
function renderCheck(app, r){
  const o = r.orders.find(x => x.slot === S.slot);
  if(!o){ S.view = 'round'; return renderRound(app, r); }
  setHeader(`第 ${r.no} 輪・檢查`, true);
  const b = basketCheck(r, o), x = b.issue;
  // 下一籃：跳到還沒檢查完的
  const nav = slotNav(r, o, q => !isCancel(r, q.slot) && !basketCheck(r, q).done, '待檢 ');
  const lastBy = Object.entries(r.checked || {}).filter(([k]) => k.startsWith(o.slot + '_')).map(([, v]) => v).sort((a,c) => c.at - a.at)[0];
  app.innerHTML = slotHeader(r, o, true)
    + (x ? `<div class="banner cancel" style="font-size:16px">有問題：${esc(ISSUE[x.type] || x.type)}${x.note ? '：' + esc(x.note) : ''}<br><span style="font-weight:400;font-size:13px">${esc(x.byName || x.by)} ${fmtTime(x.at)}</span></div>` : '')
    + (b.done && !x ? `<div class="banner ok">核對完成，可以包裝${lastBy ? `（${esc(lastBy.byName || lastBy.by)} ${fmtTime(lastBy.at)}）` : ''}</div>` : '')
    + `<p class="muted" style="margin:0 0 8px">籃子裡的商品對上一項就點一下劃掉。</p>
    <ul class="lines">${o.items.map(it => { const ck = (r.checked || {})[pkey(o.slot, it.k)];
      return `<li class="${ck ? 'put chk' : ''}" data-k="${it.k}"><span class="ck">${ck ? '✓' : ''}</span><span class="n">${esc(it.name)}${it.sku ? `<br><span class="muted">${esc(it.sku)}</span>` : ''}</span><span class="q">×${esc(it.qty)}</span></li>`; }).join('')}</ul>
    <div class="row" style="margin-top:12px">${x ? '<button class="btn" id="solve">問題已解決</button>' : '<button class="btn danger" id="issue">有問題</button>'}<button class="btn sec" id="findBtn">🔍 找籃子</button></div>`
    + nav.html;
  app.querySelectorAll('.lines li').forEach(el => el.onclick = () => {
    if(b.cancel) return toast('這張單已取消');
    const k = pkey(o.slot, el.dataset.k), on = !(r.checked || {})[k];
    buzz(on ? 30 : [20, 40, 20]);
    const willDone = on && o.items.every(it => String(it.k) === el.dataset.k || (r.checked || {})[pkey(o.slot, it.k)]);
    api.updateRound(S.taskId, r.id, {[`checked.${k}`]: on ? stamp() : null}).catch(e => toast('儲存失敗：' + e.message, 4000));
    if(willDone && !x){ buzz([40, 60, 40]); toast(`${o.slot} 號籃核對完成`); }
  });
  const ib = $('#issue'); if(ib) ib.onclick = () => openIssueSheet(r, o);
  const sb = $('#solve'); if(sb) sb.onclick = async () => {
    if(!confirm('確定問題已處理好？')) return;
    await api.updateRound(S.taskId, r.id, {[`issues.${o.slot}`]: null});
    api.addLog(S.taskId, {action:'issueSolved', round:r.no, slot:o.slot, seq:o.seq, orderId:o.id, issue:x}).catch(() => {});
    toast('已標記解決');
  };
  $('#findBtn').onclick = () => openFindSheet();
  bindNav(nav);
}
function openIssueSheet(r, o){
  const m = $('#modal'), sh = $('#sheet'); m.hidden = false;
  sh.innerHTML = `<div class="row" style="margin-bottom:10px"><b style="font-size:18px">${o.slot} 號籃有問題</b><button class="btn ghost small" id="mClose" style="flex:none">關閉</button></div>
    <div class="seg" id="itype">${Object.entries(ISSUE).map(([k, v], i) => `<button data-t="${k}" class="${i ? '' : 'on'}">${v}</button>`).join('')}</div>
    <input class="search" id="inote" placeholder="說明（例如：少一條毛巾）" autocomplete="off">
    <button class="btn danger" id="isave" style="margin-top:10px">標記有問題</button>`;
  let type = 'short';
  sh.querySelectorAll('#itype button').forEach(bt => bt.onclick = () => { type = bt.dataset.t; sh.querySelectorAll('#itype button').forEach(x => x.classList.toggle('on', x === bt)); });
  $('#isave').onclick = async () => {
    const note = $('#inote').value.trim();
    try{
      await api.updateRound(S.taskId, r.id, {[`issues.${o.slot}`]: {type, note, ...stamp()}});
      api.addLog(S.taskId, {action:'issue', type, note, round:r.no, slot:o.slot, seq:o.seq, orderId:o.id}).catch(() => {});
      m.hidden = true; toast('已標記，回到這一輪的「檢查」可以看到'); buzz(60);
    }catch(e){ toast('儲存失敗：' + e.message, 4000); }
  };
  $('#mClose').onclick = () => { m.hidden = true; };
}

/* ================= 找籃子：用託運單資訊或商品組合反查 ================= */
function openFindSheet(){
  const m = $('#modal'), sh = $('#sheet'); m.hidden = false;
  const F = {scope: 'round', picked: new Set(), q: ''};
  const scopeRounds = () => F.scope === 'round' && round() ? [round()] : S.rounds;
  const draw = () => {
    const rs = scopeRounds();
    const prods = new Map();
    rs.forEach(r => (r.orders || []).forEach(o => { if(isCancel(r, o.slot)) return; o.items.forEach(it => { const k = itemKeyOf(it); if(!prods.has(k)) prods.set(k, {k, name: it.name, n: 0}); prods.get(k).n++; }); }));
    const plist = [...prods.values()].sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    const v = F.q.toLowerCase(), C = F.picked;
    const hits = [];
    if(v || C.size) rs.forEach(r => (r.orders || []).forEach(o => {
      if(isCancel(r, o.slot)) return;
      if(v && !(String(o.id).toLowerCase().includes(v) || String(o.name).toLowerCase().includes(v) || o.p3 === v || String(o.seq) === v)) return;
      const O = new Set(o.items.map(itemKeyOf));
      if(C.size && ![...C].every(k => O.has(k))) return;
      const exact = C.size ? O.size === C.size : true, b = basketCheck(r, o);
      hits.push({r, o, exact, b, rank: (b.done && !b.issue ? 2 : 0) + (exact ? 0 : 1)});
    }));
    hits.sort((a, b) => a.rank - b.rank || a.r.no - b.r.no || a.o.slot - b.o.slot);
    sh.innerHTML = `<div class="row" style="margin-bottom:10px"><b style="font-size:18px">找籃子</b><button class="btn ghost small" id="mClose" style="flex:none">關閉</button></div>
      <div class="seg"><button data-s="round" class="${F.scope === 'round' ? 'on' : ''}" ${round() ? '' : 'disabled'}>這一輪</button><button data-s="task" class="${F.scope === 'task' ? 'on' : ''}">整個任務</button></div>
      <input class="search" id="fq" placeholder="託運單上的姓名、訂單編號、末三碼或單序" autocomplete="off" value="${esc(F.q)}">
      <div class="muted" style="margin:10px 0 4px">或點選籃子裡看到的商品（只列${F.scope === 'round' ? '這一輪' : '這個任務'}出現的）：</div>
      <div class="chips">${plist.map(p => `<button class="chip ${C.has(p.k) ? 'on' : ''}" data-p="${esc(p.k)}">${esc(p.name)}</button>`).join('')}</div>
      ${C.size ? `<button class="btn ghost small" id="fclear" style="margin-top:6px">清除商品選擇</button>` : ''}
      <div class="muted" style="margin:12px 0 6px">${v || C.size ? `找到 ${hits.length} 籃${C.size ? `（完全符合 ${hits.filter(h => h.exact).length}）` : ''}，已檢查過的排在最後` : '輸入或點選商品後會列出候選籃子'}</div>
      <div class="list">${hits.slice(0, 40).map((h, i) => `<div class="item ${h.b.done && !h.b.issue ? 'done' : ''}" data-h="${i}"><div class="main">
        <div class="t">${F.scope === 'task' ? `第 ${h.r.no} 輪 ` : ''}${h.o.slot} 號籃・${esc(h.o.name)}</div>
        <div class="s">單序 ${h.o.seq}・${esc(h.o.id)}・末三碼 ${esc(h.o.p3)}</div>
        <div class="s">${h.o.items.map(it => esc(it.name) + '×' + esc(it.qty)).join('、')}</div>
        <div class="s">${C.size ? `<span class="pill ${h.exact ? 'ok' : ''}">${h.exact ? '完全符合' : '還有其他商品'}</span> ` : ''}${h.b.issue ? '<span class="pill warn">有問題</span>' : h.b.done ? '<span class="pill">已檢查</span>' : h.b.c ? `<span class="pill pri">檢查中 ${h.b.c}/${h.b.n}</span>` : ''}</div></div></div>`).join('')}</div>`;
    sh.querySelectorAll('[data-s]').forEach(bt => bt.onclick = () => { F.scope = bt.dataset.s; draw(); });
    const fq = $('#fq'); fq.oninput = () => { F.q = fq.value.trim(); const pos = fq.selectionStart; draw(); const n = $('#fq'); n.focus(); n.setSelectionRange(pos, pos); };
    sh.querySelectorAll('[data-p]').forEach(bt => bt.onclick = () => { const k = bt.dataset.p; C.has(k) ? C.delete(k) : C.add(k); draw(); });
    const fc = $('#fclear'); if(fc) fc.onclick = () => { C.clear(); draw(); };
    sh.querySelectorAll('[data-h]').forEach(el => el.onclick = () => { const h = hits[Number(el.dataset.h)]; m.hidden = true; S.rid = h.r.id; S.mode = 'check'; S.slot = h.o.slot; S.view = 'check'; render(); window.scrollTo(0, 0); });
    $('#mClose').onclick = () => { m.hidden = true; };
  };
  draw(); $('#fq').focus();
}

/* ================= 異動：取消／優先 ================= */
function openFlagSheet(){
  const m = $('#modal'), sh = $('#sheet'); m.hidden = false;
  sh.innerHTML = `<div class="row" style="margin-bottom:10px"><b style="font-size:18px">取消／優先處理</b><button class="btn ghost small" id="mClose" style="flex:none">關閉</button></div>
    <input class="search" id="q" placeholder="訂單編號、姓名、電話末三碼或單序" autocomplete="off">
    <div id="hits" class="list" style="margin-top:10px"></div>`;
  const q = $('#q'); q.focus();
  const run = () => {
    const v = q.value.trim().toLowerCase(), hits = [];
    if(v) S.rounds.forEach(r => (r.orders || []).forEach(o => {
      if(String(o.id).toLowerCase().includes(v) || String(o.name).toLowerCase().includes(v) || o.p3 === v || String(o.seq) === v) hits.push({r, o});
    }));
    $('#hits').innerHTML = hits.slice(0, 30).map(({r, o}, i) => { const f = flagOf(r, o.slot);
      return `<div class="card" style="margin:0"><div><b>第 ${r.no} 輪 ${o.slot} 號籃</b>・單序 ${o.seq}・${esc(o.name)}（${esc(o.p3)}）</div>
        <div class="muted">${esc(o.id)}・${o.items.map(it => esc(it.name) + '×' + esc(it.qty)).join('、')}</div>
        ${f ? `<div style="margin:4px 0"><span class="pill ${f.type === 'cancel' ? 'warn' : 'pri'}">${f.type === 'cancel' ? '已取消' : '優先'}</span> <span class="muted">${esc(f.byName || f.by)} ${fmtTime(f.at)}</span></div>` : ''}
        <div class="row" style="margin-top:8px">
          <button class="btn danger small" data-i="${i}" data-t="cancel">取消</button>
          <button class="btn small" data-i="${i}" data-t="priority" style="background:var(--pri);color:#fff">優先</button>
          ${f ? `<button class="btn ghost small" data-i="${i}" data-t="clear">清除標記</button>` : ''}</div></div>`; }).join('')
      || (v ? '<div class="muted">找不到符合的訂單</div>' : '<div class="muted">輸入後會列出這個任務裡符合的訂單</div>');
    $('#hits').querySelectorAll('[data-t]').forEach(b => b.onclick = async () => {
      const {r, o} = hits[Number(b.dataset.i)], t = b.dataset.t;
      const label = {cancel:'取消', priority:'優先處理', clear:'清除標記'}[t];
      if(t === 'cancel' && !confirm(`確定把第 ${r.no} 輪 ${o.slot} 號籃（${o.name}）標記為取消？\n\n提醒：請同時到 shipment.html 和 SG 取消這張單。`)) return;
      try{
        await api.updateRound(S.taskId, r.id, {[`flags.${o.slot}`]: t === 'clear' ? null : {type:t, ...stamp()}});
        api.addLog(S.taskId, {action:t, round:r.no, slot:o.slot, seq:o.seq, orderId:o.id}).catch(() => {});
        toast(`第 ${r.no} 輪 ${o.slot} 號籃：${label}`); buzz(60);
      }catch(e){ toast('儲存失敗：' + e.message, 4000); }
      setTimeout(run, 50);
    });
  };
  q.oninput = run; run();
  $('#mClose').onclick = () => { m.hidden = true; };
}
$('#modal').onclick = e => { if(e.target.id === 'modal') $('#modal').hidden = true; };

/* ================= 啟動 ================= */
const syncNet = () => $('#net').hidden = navigator.onLine;
addEventListener('online', syncNet); addEventListener('offline', syncNet); syncNet();
api.onAuth(async (user, err) => {
  if(err){ renderLogin(err.message || String(err)); return; }
  if(!user){ if(S.unsub) S.unsub(); if(S.unsubTasks) S.unsubTasks(); S.unsub = S.unsubTasks = null; me = null; renderLogin(); return; }
  try{
    const pf = await api.profile(user);
    if(!pf.ok || pf.blocked){ renderLogin(`${user.email} 沒有使用權限，請聯絡管理員到 Hub 加入帳號。`); return; }
    me = {email: (user.email || '').toLowerCase(), name: pf.name, warehouses: pf.warehouses || [], admin: !!pf.admin};
  }catch(e){ renderLogin('讀取權限失敗：' + e.message); return; }
  const want = new URLSearchParams(location.search).get('task');
  if(want) openTask(want); else openTasks();
});
</script>
